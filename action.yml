name: "Setup C3X"
description: "Cloud cost estimates for Terraform, OpenTofu and CloudFormation, posted on every pull request. No API key."
branding:
  icon: "dollar-sign"
  color: "blue"

# A thin wrapper around the c3x Action in c3xdev/c3x (@v0), which is
# released with the CLI. Everything the install and estimate steps do,
# and every fix to them, lives there; this file only maps inputs.

inputs:
  version:
    description: 'c3x version to install, e.g. "0.3.12" or "v0.3.12". Defaults to the latest release.'
    required: false
    default: "latest"
  path:
    description: "Terraform/OpenTofu directory, plan JSON, or CloudFormation template. When set, estimates it and, on a pull request, posts the cost change as a comment. When empty, only installs the CLI."
    required: false
    default: ""
  comment:
    description: "Post or update the cost comment on the pull request (needs pull-requests: write)."
    required: false
    default: "true"
  budget:
    description: "Fail when the monthly total exceeds this amount (0 disables)."
    required: false
    default: "0"
  budget-delta:
    description: "Fail when the pull request increases the monthly total by more than this amount (0 disables)."
    required: false
    default: "0"
  strict:
    description: "Fail when any part of the estimate rests on an assumption (the comment is still posted)."
    required: false
    default: "false"
  currency:
    description: "Display currency (USD, EUR, GBP, ...)."
    required: false
    default: ""
  untrusted:
    description: 'Untrusted-input mode for the parsed configuration: "auto" (on for pull requests from forks), "true" or "false".'
    required: false
    default: "auto"
  branded-comments:
    description: "Post comments as the C3X Cloud app. Needs the app installed on the repository and 'permissions: id-token: write'; otherwise falls back to github-actions."
    required: false
    default: "false"
  show-all-projects:
    description: "Deprecated and ignored. The comment always lists every changed resource."
    required: false
    default: "true"

outputs:
  token:
    description: "Deprecated. The workflow's GITHUB_TOKEN, kept for workflows that passed it to c3x comment."
    value: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Normalise version
      id: version
      shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
      run: |
        v="$IN_VERSION"
        case "$v" in latest|v*) ;; *) v="v$v" ;; esac
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: c3x
      uses: c3xdev/c3x@v0
      with:
        version: ${{ steps.version.outputs.version }}
        install-only: ${{ inputs.path == '' && 'true' || 'false' }}
        path: ${{ inputs.path != '' && inputs.path || '.' }}
        comment: ${{ inputs.comment }}
        budget: ${{ inputs.budget }}
        budget-delta: ${{ inputs.budget-delta }}
        strict: ${{ inputs.strict }}
        currency: ${{ inputs.currency }}
        untrusted: ${{ inputs.untrusted }}
        branded-comments: ${{ inputs.branded-comments }}
